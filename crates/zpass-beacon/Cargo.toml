[package]
name = "zpass-beacon"
description = "Zcash root beacon for zPass: post group roots in shielded memos and rebuild the log from a public viewing key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "zpass-beacon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
rusqlite = "0.37"
secrecy = "0.8"
rand10 = { package = "rand", version = "0.10", features = ["sys_rng"] }
zcash_protocol.workspace = true
zcash_client_backend.workspace = true
zcash_client_sqlite.workspace = true
zcash_keys.workspace = true
zcash_primitives.workspace = true
zcash_proofs.workspace = true
zcash_address.workspace = true
zip321.workspace = true
zip32.workspace = true
zcash_note_encryption.workspace = true
orchard.workspace = true
tonic.workspace = true
